[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baselayer-backend"
version = "0.1.0"
description = "BaseLayer backend API"
authors = [
    {name = "BaseLayer Team", email = "admin@baselayer.local"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pydantic[email]>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    # passlib 1.7.4 breaks with bcrypt >= 4.1 (reads a removed __about__
    # attribute; its detect_wrap_bug probe hashes a >72-byte string that
    # bcrypt >= 4.1 rejects). Pin to the last 4.0.x.
    "bcrypt>=4.0.1,<4.1",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.6",
    "redis[hiredis]>=5.0.0",
    "arq>=0.25.0",
    "httpx>=0.25.0",
    "structlog>=23.1.0",
    "prometheus-client>=0.17.0",
    "python-json-logger>=2.0.7",
    "websockets>=12.0",
    "croniter>=2.0.0",
    "aiofiles>=23.2.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baselayer"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
