name: Tests

# Minimal fleet-standard CI: backend pytest (SQLite in-memory, no service
# containers — conftest forces sqlite+aiosqlite) + frontend typecheck/build.
# Replaces the old 10-job ci.yml pipeline (security-scan / CodeQL / Trivy /
# docker-build / integration / deploy-staging / deploy-production /
# performance) which needed infra, secrets and permissions that don't exist
# and was never green. The old file is kept as ci.yml.disabled for reference.

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test
        run: |
          cd backend
          pytest tests -o addopts="" -o filterwarnings="ignore" -q
        env:
          SECRET_KEY: test-secret-key-for-ci
          # config.py's Settings.database_url is required at import time;
          # conftest overrides it to sqlite in-memory, but Settings() is
          # constructed before that runs, so it needs a value in env.
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup reads "packageManager": "pnpm@8.7.0"
      # from the root package.json. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION / "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install & build
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
