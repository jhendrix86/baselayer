# =============================================================================
# BaseLayer Frontend — nginx site config
# =============================================================================
# Serves the built Vite/React SPA on :3000. That port matches the dev
# Caddyfile catch-all (`handle { reverse_proxy frontend:3000 }`); prod Caddy
# serves the same bundle straight from disk via file_server, so this is only
# in the request path for the dev stack.
# =============================================================================

server {
    listen      3000;
    listen      [::]:3000;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip text assets on the way out (bundle is already minified by vite).
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    # SPA history-mode fallback: unknown paths return index.html so the
    # React Router client resolves them, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Never cache the entry document itself.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
