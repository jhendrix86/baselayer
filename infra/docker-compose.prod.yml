# =============================================================================
# BaseLayer Production Docker Compose
# =============================================================================
# For production deployment on baselayer (192.168.1.50)
# =============================================================================

version: '3.8'

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: baselayer-postgres
    restart: always
    environment:
      POSTGRES_DB: baselayer_prod
      POSTGRES_USER: baselayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
      - ./backups/postgres:/backups
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - baselayer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baselayer -d baselayer_prod"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis 7 Cache and Message Queue
  redis:
    image: redis:7-alpine
    container_name: baselayer-redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./config/redis/redis.prod.conf:/usr/local/etc/redis/redis.conf
      - ./backups/redis:/backups
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - baselayer
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Caddy Reverse Proxy (Production)
  caddy:
    image: caddy:2-alpine
    container_name: baselayer-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy/Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./ssl:/etc/ssl/caddy
      - /var/log/caddy:/var/log/caddy
    networks:
      - baselayer
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API Service
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: production
    container_name: baselayer-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://baselayer:${POSTGRES_PASSWORD}@postgres:5432/baselayer_prod
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=https://baselayer.local,http://192.168.1.50:3000
    volumes:
      - ./uploads:/var/lib/baselayer/uploads
      - ./logs:/var/log/baselayer
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - baselayer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Background Worker Service
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: production
    container_name: baselayer-worker
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://baselayer:${POSTGRES_PASSWORD}@postgres:5432/baselayer_prod
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - WORKER_MODE=true
    volumes:
      - ./uploads:/var/lib/baselayer/uploads
      - ./logs:/var/log/baselayer
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - baselayer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "arq"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Agent Orchestration Service
  agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: production
    container_name: baselayer-agent
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://baselayer:${POSTGRES_PASSWORD}@postgres:5432/baselayer_prod
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - AGENT_MODE=true
      - OLLAMA_URL=http://localhost:11434
    volumes:
      - ./uploads:/var/lib/baselayer/uploads
      - ./logs:/var/log/baselayer
      - /home/baselayer/ai/models:/models
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - baselayer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Frontend Production Build
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      target: production
    container_name: baselayer-frontend
    restart: always
    networks:
      - baselayer
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/postgresql/data
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/redis/data
  caddy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/caddy/data
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/caddy/config

networks:
  baselayer:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
